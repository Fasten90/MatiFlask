<!DOCTYPE html>
<html>
<head>
    <title>MatiGo 2.0</title>
    <style>
        .edit { background: #fff3cd; }
    </style>
</head>
<body>

<h2>MatiGo 2.0</h2>

<button onclick="setMode('user')">User mode</button>
<button onclick="setMode('edit')">Edit mode</button>

<br><br>

<input type="date" id="datum">
<button onclick="load()">Betöltés</button>

<br><br>

<div id="editControls" style="display:none;">
    <button onclick="ujJarat()">+ Új járat</button>
    <button onclick="ujMegallo()">+ Új megálló</button>
    <button onclick="saveAll()">💾 Mentés</button>
</div>

<br>

<table border="1" id="tabla"></table>

<script>
let mode = "user"
let data = []

function setMode(m) {
    mode = m
    document.getElementById("editControls").style.display =
        (mode === "edit") ? "block" : "none"
    render()
}

function load() {
    let datum = document.getElementById("datum").value

    fetch(`/matigo2.0_menetrend?datum=${datum}`)
    .then(r => r.json())
    .then(res => {
        data = res
        render()
    })
}

function render() {
    let table = document.getElementById("tabla")
    table.innerHTML = ""

    data.forEach((row, index) => {
        let tr = document.createElement("tr")

        if (!row.id) tr.classList.add("edit")

        ["datum", "idopont", "jarat", "irany", "megallo"].forEach(field => {
            let td = document.createElement("td")
            td.innerText = row[field] || ""

            if (mode === "edit") {
                td.contentEditable = true
                td.oninput = () => {
                    row[field] = td.innerText
                }
            }

            tr.appendChild(td)
        })

        table.appendChild(tr)
    })
}

function ujJarat() {
    let now = new Date()
    now.setHours(now.getHours() + 1)
    now.setMinutes(0)

    let datum = document.getElementById("datum").value

    data.push({
        datum: datum,
        idopont: now.toTimeString().slice(0,5),
        jarat: "",
        irany: "",
        megallo: ""
    })

    render()
}

function ujMegallo() {
    if (data.length === 0) return

    let last = data[data.length - 1]

    data.push({
        datum: last.datum,
        idopont: last.idopont,
        jarat: last.jarat,
        irany: last.irany,
        megallo: ""
    })

    render()
}

function saveAll() {
    fetch("/save-all", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(() => load())
}
</script>

</body>
</html>
