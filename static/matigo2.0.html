<!DOCTYPE html>
<html>
<head>
    <title>MatiGo 2.0</title>
    <style>
        body { font-family: Arial; }
        table { border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid #000; padding: 5px; min-width: 80px; }
        .edit { background: #fff3cd; }
        .toolbar { margin-bottom: 10px; }
        tr:hover { background: #f0f0f0; }
        .del-btn { background: #e74c3c; color: white; border: none; cursor: pointer; padding: 2px 7px; border-radius: 3px; }

        /* Járat link */
        .jarat-link {
            color: #0066cc;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }
        .jarat-link:hover {
            color: #004499;
        }

        /* Modal */
        #jaratModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #jaratModal.open {
            display: flex;
        }
        #modalBox {
            background: #fff;
            border-radius: 8px;
            padding: 20px 24px;
            min-width: 320px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            position: relative;
        }
        #modalTitle {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 12px;
        }
        #modalClose {
            position: absolute;
            top: 10px; right: 14px;
            font-size: 1.4em;
            cursor: pointer;
            background: none;
            border: none;
            color: #666;
        }
        #modalClose:hover { color: #000; }
        #modalTable {
            border-collapse: collapse;
            width: 100%;
            margin-top: 6px;
        }
        #modalTable th, #modalTable td {
            border: 1px solid #ccc;
            padding: 5px 10px;
            text-align: left;
        }
        #modalTable th {
            background: #f0f0f0;
        }
        .modal-current {
            background: #fff3cd;
            font-weight: bold;
        }
        .modal-past {
            color: #aaa;
        }
    </style>
</head>
<body>

<h2>MatiGo 2.0</h2>

<div class="toolbar">
    <input type="date" id="datum">
    <button onclick="load()">Betöltés</button>
</div>

<div class="toolbar">
    <button onclick="setMode('user')">User mode</button>
    <button onclick="setMode('edit')">Edit mode</button>
</div>

<!-- 🔍 SEARCH (user mode only) -->
<div id="searchBox" class="toolbar">
    <input type="text" id="searchInput" placeholder="Megálló keresés" oninput="search()">
    <button onclick="resetSearch()">Reset</button>
</div>

<!-- 🔄 AUTO-REFRESH (user mode only) -->
<div id="autoRefreshBox" class="toolbar">
    <label>
        <input type="checkbox" id="autoRefresh" onchange="startAutoRefreshIfChecked()">
        Auto-refresh (60s)
    </label>
</div>

<!-- ✏️ EDIT CONTROLS -->
<div id="editControls" class="toolbar" style="display:none;">
    <button onclick="ujJarat()">+ Új járat</button>
    <button onclick="ujMegallo()">+ Új megálló</button>
    <button onclick="saveAll()">💾 Mentés</button>
</div>

<table id="tabla">
    <thead>
        <tr>
            <th>Dátum</th>
            <th>Idő</th>
            <th>Járat</th>
            <th>Irány</th>
            <th>Megálló</th>
            <th id="thDelete" style="display:none;"></th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- JÁRAT MODAL -->
<div id="jaratModal" onclick="closeModalOnBackdrop(event)">
    <div id="modalBox">
        <button id="modalClose" onclick="closeModal()">✕</button>
        <div id="modalTitle"></div>
        <table id="modalTable">
            <thead>
                <tr>
                    <th>Idő</th>
                    <th>Megálló</th>
                </tr>
            </thead>
            <tbody id="modalBody"></tbody>
        </table>
    </div>
</div>

<script>
let data = []
let originalData = []
let mode = "user"

// ----------------------------
// AUTO-REFRESH
// ----------------------------
let autoRefreshInterval = null

function startAutoRefreshIfChecked() {
    stopAutoRefresh()
    if (document.getElementById("autoRefresh").checked) {
        autoRefreshInterval = setInterval(() => {
            load()
        }, 60000)
    }
}

function stopAutoRefresh() {
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval)
        autoRefreshInterval = null
    }
}

// ----------------------------
// INIT
// ----------------------------
window.onload = () => {
    let today = new Date().toISOString().split("T")[0]
    document.getElementById("datum").value = today
    load()
}

// ----------------------------
// MODE
// ----------------------------
function setMode(m) {
    mode = m

    document.getElementById("editControls").style.display =
        (mode === "edit") ? "block" : "none"

    document.getElementById("searchBox").style.display =
        (mode === "user") ? "block" : "none"

    document.getElementById("autoRefreshBox").style.display =
        (mode === "user") ? "block" : "none"

    document.getElementById("thDelete").style.display =
        (mode === "edit") ? "" : "none"

    // Edit módba lépéskor leállítjuk az auto-refresht
    if (mode === "edit") {
        stopAutoRefresh()
    } else {
        // User módba visszalépve, ha be volt pipálva, újraindul
        startAutoRefreshIfChecked()
    }

    render()
}

// ----------------------------
// LOAD
// ----------------------------
function load() {
    let datum = document.getElementById("datum").value

    if (!datum) return

    fetch(`/matigo2.0_menetrend?datum=${datum}`)
    .then(r => r.json())
    .then(res => {
        originalData = res
        data = [...res]
        render()
    })
}

// ----------------------------
// SEARCH (LOCAL)
// ----------------------------
function search() {
    let val = document.getElementById("searchInput").value.toLowerCase()

    if (!val) {
        data = [...originalData]
        render()
        return
    }

    data = originalData.filter(row =>
        (row.megallo || "")
            .toString()
            .trim()
            .toLowerCase()
            .startsWith(val) ||
        (row.megallo || "")
            .toString()
            .trim()
            .toLowerCase()
            .includes(val)
    )

    render()
}

// ----------------------------
function resetSearch() {
    document.getElementById("searchInput").value = ""
    data = [...originalData]
    render()
}

// ----------------------------
// DELETE
// ----------------------------
function deleteRow(id) {
    if (!confirm("Biztosan törlöd ezt a sort?")) return

    fetch("/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids: [id] })
    })
    .then(res => {
        if (!res.ok) throw new Error("HTTP ERROR " + res.status)
        return res.json()
    })
    .then(() => load())
    .catch(err => {
        console.error("DELETE ERROR:", err)
        alert("Törlés sikertelen: " + err.message)
    })
}

// ----------------------------
// RENDER
// ----------------------------
function render() {
    let tbody = document.querySelector("#tabla tbody")
    tbody.innerHTML = ""

    if (data.length === 0) {
        let tr = document.createElement("tr")
        let td = document.createElement("td")
        td.colSpan = 5
        td.innerText = "Nincs adat"
        tr.appendChild(td)
        tbody.appendChild(tr)
        return
    }

    data.forEach((row) => {

        // USER MODE SZŰRÉS
        if (mode === "user") {
            let displayTime = getDisplayTime(row)
            if (displayTime === null) return
            row._displayTime = displayTime
        }

        let tr = document.createElement("tr")

        if (!row.id) tr.classList.add("edit")

        addCell(tr, row, "datum")

        // Idő cella
        if (mode === "user") {
            let td = document.createElement("td")
            td.innerText = row._displayTime
            tr.appendChild(td)
        } else {
            addCell(tr, row, "idopont")
        }

        // Járat cella – user módban kattintható link
        if (mode === "user" && row.jarat) {
            let td = document.createElement("td")
            let span = document.createElement("span")
            span.className = "jarat-link"
            span.innerText = row.jarat
            span.onclick = () => openJaratModal(row)
            td.appendChild(span)
            tr.appendChild(td)
        } else {
            addCell(tr, row, "jarat")
        }

        addCell(tr, row, "irany")
        addCell(tr, row, "megallo")

        // Edit módban törlés gomb
        if (mode === "edit") {
            let td = document.createElement("td")
            if (row.id) {
                let btn = document.createElement("button")
                btn.className = "del-btn"
                btn.innerText = "🗑️"
                btn.onclick = () => deleteRow(row.id)
                td.appendChild(btn)
            }
            tr.appendChild(td)
        }

        tbody.appendChild(tr)
    })
}

// ----------------------------
function addCell(tr, row, field) {
    let td = document.createElement("td")
    td.innerText = row[field] || ""

    if (mode === "edit") {
        td.contentEditable = true
        td.oninput = () => {
            row[field] = td.innerText
        }
    }

    tr.appendChild(td)
}

// ----------------------------
// JÁRAT MODAL
// ----------------------------
function openJaratModal(clickedRow) {
    let jaratNev = clickedRow.jarat
    let datum = clickedRow.datum
    let clickedIdopont = clickedRow.idopont

    // Az originalData-ból kiszűrjük az adott járat összes megállóját,
    // időrendben (az ORDER BY idopont már a backendtől jön, de biztosra megyünk)
    let jaratSorok = originalData
        .filter(r => r.jarat === jaratNev && r.datum === datum)
        .sort((a, b) => (a.idopont > b.idopont ? 1 : -1))

    // Ha nincs elég megálló (pl. csak 1 sor), akkor is megmutatjuk
    let irany = jaratSorok.length > 0 ? jaratSorok[0].irany : ""

    document.getElementById("modalTitle").innerText =
        `🚌 ${jaratNev} járat${irany ? " – " + irany : ""} (${datum})`

    let tbody = document.getElementById("modalBody")
    tbody.innerHTML = ""

    let now = new Date()

    jaratSorok.forEach(row => {
        let tr = document.createElement("tr")

        // Jelenlegi / múlt / jövő megkülönböztetés
        let dt = new Date(row.datum + "T" + row.idopont)
        let diffMin = Math.floor((dt - now) / 60000)

        if (row.idopont === clickedIdopont) {
            tr.classList.add("modal-current")
        } else if (diffMin < 0) {
            tr.classList.add("modal-past")
        }

        let tdIdo = document.createElement("td")
        tdIdo.innerText = row.idopont || ""

        let tdMegallo = document.createElement("td")
        tdMegallo.innerText = row.megallo || ""

        tr.appendChild(tdIdo)
        tr.appendChild(tdMegallo)
        tbody.appendChild(tr)
    })

    document.getElementById("jaratModal").classList.add("open")
}

function closeModal() {
    document.getElementById("jaratModal").classList.remove("open")
}

function closeModalOnBackdrop(event) {
    if (event.target === document.getElementById("jaratModal")) {
        closeModal()
    }
}

// Escape gombra is bezár
document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal()
})

// ----------------------------
// ÚJ JÁRAT
// ----------------------------
function ujJarat() {
    let datum = document.getElementById("datum").value
    if (!datum) return

    let now = new Date()
    now.setHours(now.getHours() + 1)
    now.setMinutes(0)

    data.push({
        datum: datum,
        idopont: now.toTimeString().slice(0,5),
        jarat: "",
        irany: "",
        megallo: ""
    })

    render()
}

// ----------------------------
// ÚJ MEGÁLLÓ
// ----------------------------
function ujMegallo() {
    if (data.length === 0) return

    let last = data[data.length - 1]

    data.push({
        datum: last.datum,
        idopont: last.idopont,
        jarat: last.jarat,
        irany: last.irany,
        megallo: ""
    })

    render()
}

// ----------------------------
// SAVE
// ----------------------------
function saveAll() {
    console.log("=== SAVE START ===")
    console.log("DATA:", data)
    console.log("JSON:", JSON.stringify(data))

    fetch("/save-all", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(async res => {
        console.log("STATUS:", res.status)

        let text = await res.text()
        console.log("RESPONSE TEXT:", text)

        try {
            let json = JSON.parse(text)
            console.log("RESPONSE JSON:", json)
        } catch (e) {
            console.log("NOT JSON RESPONSE")
        }

        if (!res.ok) {
            throw new Error("HTTP ERROR " + res.status)
        }

        load()
    })
    .catch(err => {
        console.error("SAVE ERROR:", err)
    })
}


function getDisplayTime(row) {
    if (!row.datum || !row.idopont) return ""

    let now = new Date()

    let dt = new Date(row.datum + "T" + row.idopont)

    let diffMin = Math.floor((dt - now) / 60000)

    if (diffMin < 0) return null // múlt → ne jelenjen meg

    if (diffMin < 60) return diffMin + " perc"

    return row.idopont
}
</script>

</body>
</html>
