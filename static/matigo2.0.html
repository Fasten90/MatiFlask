<!DOCTYPE html>
<html>
<head>
    <title>MatiGo 2.0</title>
    <style>
        body { font-family: Arial; }
        table { border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid #000; padding: 5px; min-width: 80px; }
        .edit { background: #fff3cd; }
        .toolbar { margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>MatiGo 2.0</h2>

<div class="toolbar">
    <input type="date" id="datum">
    <button onclick="load()">Betöltés</button>
</div>

<div class="toolbar">
    <button onclick="setMode('user')">User mode</button>
    <button onclick="setMode('edit')">Edit mode</button>
</div>

<!-- 🔍 SEARCH (user mode only) -->
<div id="searchBox" class="toolbar">
    <input type="text" id="searchInput" placeholder="Megálló keresés" oninput="search()">
    <button onclick="resetSearch()">Reset</button>
</div>

<!-- ✏️ EDIT CONTROLS -->
<div id="editControls" class="toolbar" style="display:none;">
    <button onclick="ujJarat()">+ Új járat</button>
    <button onclick="ujMegallo()">+ Új megálló</button>
    <button onclick="saveAll()">💾 Mentés</button>
</div>

<table id="tabla">
    <thead>
        <tr>
            <th>Dátum</th>
            <th>Idő</th>
            <th>Járat</th>
            <th>Irány</th>
            <th>Megálló</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let data = []
let originalData = []
let mode = "user"

// ----------------------------
// INIT
// ----------------------------
window.onload = () => {
    let today = new Date().toISOString().split("T")[0]
    document.getElementById("datum").value = today
    load()
}

// ----------------------------
// MODE
// ----------------------------
function setMode(m) {
    mode = m

    document.getElementById("editControls").style.display =
        (mode === "edit") ? "block" : "none"

    document.getElementById("searchBox").style.display =
        (mode === "user") ? "block" : "none"

    render()
}

// ----------------------------
// LOAD
// ----------------------------
function load() {
    let datum = document.getElementById("datum").value

    if (!datum) return

    fetch(`/matigo2.0_menetrend?datum=${datum}`)
    .then(r => r.json())
    .then(res => {
        originalData = res
        data = [...res]
        render()
    })
}

// ----------------------------
// SEARCH (LOCAL)
// ----------------------------
function search() {
    let val = document.getElementById("searchInput").value.toLowerCase()

    if (!val) {
        data = [...originalData]
        render()
        return
    }

    data = originalData.filter(row =>
        (row.megallo || "")
            .toString()
            .trim()
            .toLowerCase()
            .startsWith(val) ||
        (row.megallo || "")
            .toString()
            .trim()
            .toLowerCase()
            .includes(val)
    )

    render()
}

// ----------------------------
function resetSearch() {
    document.getElementById("searchInput").value = ""
    data = [...originalData]
    render()
}

// ----------------------------
// RENDER
// ----------------------------
function render() {
    let tbody = document.querySelector("#tabla tbody")
    tbody.innerHTML = ""

    if (data.length === 0) {
        let tr = document.createElement("tr")
        let td = document.createElement("td")
        td.colSpan = 5
        td.innerText = "Nincs adat"
        tr.appendChild(td)
        tbody.appendChild(tr)
        return
    }

    data.forEach((row) => {
        let tr = document.createElement("tr")

        if (!row.id) tr.classList.add("edit")

        addCell(tr, row, "datum")
        addCell(tr, row, "idopont")
        addCell(tr, row, "jarat")
        addCell(tr, row, "irany")
        addCell(tr, row, "megallo")

        tbody.appendChild(tr)
    })
}

// ----------------------------
function addCell(tr, row, field) {
    let td = document.createElement("td")
    td.innerText = row[field] || ""

    if (mode === "edit") {
        td.contentEditable = true
        td.oninput = () => {
            row[field] = td.innerText
        }
    }

    tr.appendChild(td)
}

// ----------------------------
// ÚJ JÁRAT
// ----------------------------
function ujJarat() {
    let datum = document.getElementById("datum").value
    if (!datum) return

    let now = new Date()
    now.setHours(now.getHours() + 1)
    now.setMinutes(0)

    data.push({
        datum: datum,
        idopont: now.toTimeString().slice(0,5),
        jarat: "",
        irany: "",
        megallo: ""
    })

    render()
}

// ----------------------------
// ÚJ MEGÁLLÓ
// ----------------------------
function ujMegallo() {
    if (data.length === 0) return

    let last = data[data.length - 1]

    data.push({
        datum: last.datum,
        idopont: last.idopont,
        jarat: last.jarat,
        irany: last.irany,
        megallo: ""
    })

    render()
}

// ----------------------------
// SAVE
// ----------------------------
function saveAll() {
    fetch("/save-all", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(() => load())
}
</script>

</body>
</html>
