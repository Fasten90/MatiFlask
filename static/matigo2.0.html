<!DOCTYPE html>
<html>
<head>
    <title>MatiGo 2.0</title>
    <style>
        body { font-family: Arial; }
        .edit { background: #fff3cd; }
        .toolbar { margin-bottom: 10px; }
        table td { padding: 5px; min-width: 80px; }
    </style>
</head>
<body>

<h2>MatiGo 2.0</h2>

<div class="toolbar">
    <button onclick="setMode('user')">User mode</button>
    <button onclick="setMode('edit')">Edit mode</button>
</div>

<div class="toolbar">
    <input type="date" id="datum">
    <button onclick="load()">Betöltés</button>
</div>

<div id="editControls" class="toolbar" style="display:none;">
    <button onclick="ujJarat()">+ Új járat</button>
    <button onclick="ujMegallo()">+ Új megálló</button>
    <button onclick="saveAll()">💾 Mentés</button>
</div>

<table border="1" id="tabla"></table>

<script>
let mode = "user"
let data = []

// ----------------------------
// INIT
// ----------------------------
window.onload = () => {
    let today = new Date().toISOString().split("T")[0]
    document.getElementById("datum").value = today
    load()
}

// ----------------------------
// MODE SWITCH
// ----------------------------
function setMode(m) {
    mode = m
    document.getElementById("editControls").style.display =
        (mode === "edit") ? "block" : "none"

    render()
}

// ----------------------------
// LOAD
// ----------------------------
function load() {
    let datum = document.getElementById("datum").value

    console.log("LOAD datum:", datum)

    if (!datum) {
        alert("Nincs dátum kiválasztva")
        return
    }

    fetch(`/matigo2.0_menetrend?datum=${datum}`)
    .then(r => r.json())
    .then(res => {
        console.log("API result:", res)
        data = res
        render()
    })
}

// ----------------------------
// RENDER
// ----------------------------
function render() {
    let table = document.getElementById("tabla")
    table.innerHTML = ""

    if (data.length === 0) {
        table.innerHTML = "<tr><td>Nincs adat</td></tr>"
        return
    }

    data.forEach((row, index) => {
        let tr = document.createElement("tr")

        if (!row.id) tr.classList.add("edit")

        ["datum", "idopont", "jarat", "irany", "megallo"].forEach(field => {
            let td = document.createElement("td")
            td.innerText = row[field] || ""

            if (mode === "edit") {
                td.contentEditable = true

                td.oninput = () => {
                    row[field] = td.innerText
                }
            }

            tr.appendChild(td)
        })

        table.appendChild(tr)
    })
}

// ----------------------------
// ÚJ JÁRAT
// ----------------------------
function ujJarat() {
    let datum = document.getElementById("datum").value

    if (!datum) return

    let now = new Date()
    now.setHours(now.getHours() + 1)
    now.setMinutes(0)

    data.push({
        datum: datum,
        idopont: now.toTimeString().slice(0,5),
        jarat: "",
        irany: "",
        megallo: ""
    })

    render()
}

// ----------------------------
// ÚJ MEGÁLLÓ
// ----------------------------
function ujMegallo() {
    if (data.length === 0) return

    let last = data[data.length - 1]

    data.push({
        datum: last.datum,
        idopont: last.idopont,
        jarat: last.jarat,
        irany: last.irany,
        megallo: ""
    })

    render()
}

// ----------------------------
// SAVE
// ----------------------------
function saveAll() {
    console.log("SAVE data:", data)

    fetch("/save-all", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(res => {
        console.log("SAVE response:", res)
        load()
    })
}
</script>

</body>
</html>
