<!DOCTYPE html>
<html>
<head>
    <title>MatiGo 2.0</title>
    <style>
        body { font-family: Arial; }
        table { border-collapse: collapse; }
        td, th { border: 1px solid #000; padding: 5px; }
        .edit { background: #fff3cd; }
    </style>
</head>
<body>

<h2>MatiGo 2.0</h2>

<input type="date" id="datum">
<button onclick="load()">Betöltés</button>

<br><br>

<button onclick="setMode('user')">User mode</button>
<button onclick="setMode('edit')">Edit mode</button>

<div id="searchBox" style="margin-top:10px;">
    <input type="text" id="searchInput" placeholder="Megálló keresés">
    <button onclick="search()">Keresés</button>
    <button onclick="load()">Reset</button>
</div>

<div id="editControls" style="display:none; margin-top:10px;">
    <button onclick="ujJarat()">+ Új járat</button>
    <button onclick="ujMegallo()">+ Új megálló</button>
    <button onclick="saveAll()">💾 Mentés</button>
</div>

<br><br>

<table id="tabla">
    <thead>
        <tr>
            <th>Dátum</th>
            <th>Idő</th>
            <th>Járat</th>
            <th>Irány</th>
            <th>Megálló</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
let data = []
let mode = "user"

// ----------------------------
window.onload = () => {
    let today = new Date().toISOString().split("T")[0]
    document.getElementById("datum").value = today
    load()
}

// ----------------------------
function setMode(m) {
    mode = m

    document.getElementById("editControls").style.display =
        (mode === "edit") ? "block" : "none"

    document.getElementById("searchBox").style.display =
        (mode === "user") ? "block" : "none"

    render()
}

// ----------------------------
function load() {
    let datum = document.getElementById("datum").value

    fetch(`/matigo2.0_menetrend?datum=${datum}`)
    .then(r => r.json())
    .then(res => {
        data = res
        render()
    })
}

// ----------------------------
// 🔍 SEARCH
// ----------------------------
function search() {
    let val = document.getElementById("searchInput").value

    if (!val) {
        load()
        return
    }

    fetch(`/search-megallo?megallo=${val}`)
    .then(r => r.json())
    .then(res => {
        data = res
        render()
    })
}

// ----------------------------
function render() {
    let tbody = document.querySelector("#tabla tbody")
    tbody.innerHTML = ""

    if (data.length === 0) {
        let tr = document.createElement("tr")
        let td = document.createElement("td")
        td.colSpan = 5
        td.innerText = "Nincs találat"
        tr.appendChild(td)
        tbody.appendChild(tr)
        return
    }

    data.forEach((row) => {
        let tr = document.createElement("tr")

        if (!row.id) tr.classList.add("edit")

        addCell(tr, row, "datum")
        addCell(tr, row, "idopont")
        addCell(tr, row, "jarat")
        addCell(tr, row, "irany")
        addCell(tr, row, "megallo")

        tbody.appendChild(tr)
    })
}

// ----------------------------
function addCell(tr, row, field) {
    let td = document.createElement("td")
    td.innerText = row[field] || ""

    if (mode === "edit") {
        td.contentEditable = true
        td.oninput = () => {
            row[field] = td.innerText
        }
    }

    tr.appendChild(td)
}

// ----------------------------
function ujJarat() {
    let datum = document.getElementById("datum").value

    let now = new Date()
    now.setHours(now.getHours() + 1)
    now.setMinutes(0)

    data.push({
        datum: datum,
        idopont: now.toTimeString().slice(0,5),
        jarat: "",
        irany: "",
        megallo: ""
    })

    render()
}

// ----------------------------
function ujMegallo() {
    if (data.length === 0) return

    let last = data[data.length - 1]

    data.push({
        datum: last.datum,
        idopont: last.idopont,
        jarat: last.jarat,
        irany: last.irany,
        megallo: ""
    })

    render()
}

// ----------------------------
function saveAll() {
    fetch("/save-all", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(() => load())
}
</script>

</body>
</html>
